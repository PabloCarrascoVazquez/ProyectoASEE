info:
  name: Actualizar estado logístico (Ej. "En reparto")
  type: http
  seq: 2
  tags:
    - Logística

http:
  method: PUT
  url: "{{baseUrl}}/envios/:id_envio/tracking"
  params:
    - name: id_envio
      value: "env-001"
      type: path
  body:
    type: json
    data: |-
      {
        "estado_envio": "En Reparto",
        "tracking_number": "PK392817492ES",
        "notas_incidencia": "Dirección incompleta, contactando al cliente."
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Estado del envío actualizado.
    request:
      url: "{{baseUrl}}/envios/:id_envio/tracking"
      method: PUT
      params:
        - name: id_envio
          value: "env-001"
          type: path
      body:
        type: json
        data: |-
          {
            "estado_envio": "En Reparto",
            "tracking_number": "PK392817492ES",
            "notas_incidencia": "Dirección incompleta, contactando al cliente."
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id_envio": "e9876543-e89b-12d3-a456-426614174111",
            "id_pedido": "ped-10293847",
            "estado_envio": "Enviado",
            "empresa_transporte": "Correos Express",
            "tracking_number": "PK392817492ES",
            "direccion_entrega": "Calle Falsa 123, 28080 Madrid"
