        data: |-
          {
            "variacion_unidades": -5
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "codigo": 400,
            "mensaje": "Error en la petición",
            "detalle": "Stock insuficiente para la cantidad solicitada."
          }
  - name: 500 Response
    description: Error interno del servidor.
    request:
      url: "{{baseUrl}}/inventario/:id_producto"
      method: PUT
      params:
        - name: id_producto
          value: ""
