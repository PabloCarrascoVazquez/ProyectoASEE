info:
  name: Solicitar alquiler de parcela por un proveedor
  type: http
  seq: 2
  tags:
    - Catálogo - Espacios

http:
  method: POST
  url: "{{baseUrl}}/espacios/:id/alquileres"
  params:
    - name: id
      value: ""
      type: path
      description: ID del espacio/parcela a alquilar.
  body:
    type: json
    data: |-
      {
        "nombre_negocio": "Burger King Foodtruck",
        "tipo_negocio": "Restauración",
        "necesita_conexion_electrica": true
      }
  auth:
    type: bearer
    token: "{{jwtToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Solicitud de alquiler registrada correctamente.
    request:
      url: "{{baseUrl}}/espacios/:id/alquileres"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: ID del espacio/parcela a alquilar.
      body:
        type: json
        data: |-
          {
            "nombre_negocio": "Burger King Foodtruck",
            "tipo_negocio": "Restauración",
            "necesita_conexion_electrica": true
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id_contrato": "alq-9876-5432",
            "estado": "Pendiente de firma",
            "fecha_solicitud": "2026-10-15T18:15:00Z"
          }
  - name: 400 Response
    description: Petición malformada o faltan parámetros requeridos.
    request:
      url: "{{baseUrl}}/espacios/:id/alquileres"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: ID del espacio/parcela a alquilar.
      body:
        type: json
        data: |-
          {
            "nombre_negocio": "Burger King Foodtruck",
            "tipo_negocio": "Restauración",
            "necesita_conexion_electrica": true
          }
    response:
