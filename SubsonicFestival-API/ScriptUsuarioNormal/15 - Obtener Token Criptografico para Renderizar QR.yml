info:
  name: 15 - Obtener Token Criptográfico para Renderizar QR
  type: http
  seq: 15
  tags:
    - ScriptUsuarioNormal
    - Wallet

http:
  method: GET
  url: "{{baseUrl}}/pedidos/mis-entradas/:id_entrada/qr"
  params:
    - name: id_entrada
      value: "{{idEntrada}}"
      type: path
  auth:
    type: bearer
    token: "{{jwtToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Token QR dinámico obtenido correctamente", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().token_qr).to.be.a('string');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
