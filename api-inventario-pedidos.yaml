openapi: 3.0.3
info:
  title: Servicio de Inventarios y Envíos
  description: Gestión de stock de merchandising y tracking de paquetería logística.
  version: 1.0.0
servers:
  - url: http://localhost:8004/api
paths:
  /inventario/stock:
    get:
      tags: [Almacén]
      summary: Consultar stock disponible de productos
      responses:
        '200':
          description: Listado del stock disponible devuelto con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockProducto'
        '500':
          $ref: '#/components/responses/InternalError'

  /inventario/{id_producto}:
    put:
      tags: [Almacén]
      summary: Actualizar stock físico (Solo Admin)
      security: [{bearerAuth: []}]
      parameters:
        - name: id_producto
          in: path
          required: true
          schema: 
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionStockRequest'
      responses:
        '200':
          description: Stock actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockProducto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /inventario/{id_producto}/bloquear:
    post:
      tags: [Almacén - Transaccional]
      summary: Bloqueo temporal de stock (Llamada interna desde Servicio de Compras)
      security: [{bearerAuth: []}]
      parameters:
        - name: id_producto
          in: path
          required: true
          schema: 
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueoStockRequest'
      responses:
        '200':
          description: Stock de merchandising bloqueado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueoStockResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stock agotado o insuficiente para este producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /inventario/{id_producto}/liberar:
    post:
      tags: [Almacén - Transaccional]
      summary: Liberar stock bloqueado tras expiración de carrito o fallo de pago
      security: [{bearerAuth: []}]
      parameters:
        - name: id_producto
          in: path
          required: true
          schema: 
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueoStockRequest'
      responses:
        '200':
          description: Stock liberado correctamente, vuelve a estar disponible.
        '500':
          $ref: '#/components/responses/InternalError'

  /envios:
    get:
      tags: [Logística]
      summary: Listar envíos pendientes de despachar
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de paquetes y envíos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvioLogistico'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /envios/{id_envio}/tracking:
    put:
      tags: [Logística]
      summary: Actualizar estado logístico (Ej. "En reparto")
      security: [{bearerAuth: []}]
      parameters:
        - name: id_envio
          in: path
          required: true
          schema: 
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionTrackingRequest'
      responses:
        '200':
          description: Estado del envío actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvioLogistico'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StockProducto:
      type: object
      properties:
        id_producto:
          type: string
          format: uuid
          example: "p1234567-e89b-12d3-a456-426614174000"
        nombre_producto:
          type: string
          example: "Camiseta Oficial Subsonic"
        variante:
          type: string
          example: "Talla L - Negra"
        unidades_disponibles:
          type: integer
          example: 150
        precio:
          type: number
          format: float
          example: 25.50
        ubicacion_almacen:
          type: string
          example: "Pasillo B - Estante 4"

    ActualizacionStockRequest:
      type: object
      required:
        - variacion_unidades
      properties:
        variacion_unidades:
          type: integer
          description: Cantidad a sumar (positivo) o restar (negativo) al stock actual.
          example: -5

    BloqueoStockRequest:
      type: object
      required:
        - cantidad
      properties:
        cantidad:
          type: integer
          description: Cantidad de unidades a bloquear/liberar temporalmente.
          default: 1
          example: 2

    BloqueoStockResponse:
      type: object
      properties:
        bloqueado:
          type: boolean
          example: true
        id_producto:
          type: string
          format: uuid
          example: "p1234567-e89b-12d3-a456-426614174000"
        precio_unitario:
          type: number
          format: float
          example: 25.50

    EnvioLogistico:
      type: object
      properties:
        id_envio:
          type: string
          format: uuid
          example: "e9876543-e89b-12d3-a456-426614174111"
        id_pedido:
          type: string
          format: uuid
          example: "ped-10293847"
        estado_envio:
          type: string
          enum: [Pendiente, Preparando, Enviado, En Reparto, Entregado, Incidencia]
          example: "Enviado"
        empresa_transporte:
          type: string
          example: "Correos Express"
        tracking_number:
          type: string
          example: "PK392817492ES"
        direccion_entrega:
          type: string
          example: "Calle Falsa 123, 28080 Madrid"

    ActualizacionTrackingRequest:
      type: object
      required:
        - estado_envio
      properties:
        estado_envio:
          type: string
          enum: [Pendiente, Preparando, Enviado, En Reparto, Entregado, Incidencia]
          example: "En Reparto"
        tracking_number:
          type: string
          description: Se añade si se genera en este momento.
          example: "PK392817492ES"
        notas_incidencia:
          type: string
          example: "Dirección incompleta, contactando al cliente."

    Error:
      type: object
      properties:
        codigo:
          type: integer
          example: 400
        mensaje:
          type: string
          example: "Error en la petición"
        detalle:
          type: string
          example: "Stock insuficiente para la cantidad solicitada."

  responses:
    BadRequest:
      description: Petición malformada o faltan parámetros requeridos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Acceso no autorizado (Token JWT inválido o caducado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: No tienes permisos suficientes para realizar esta acción (ej. requiere rol Admin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'