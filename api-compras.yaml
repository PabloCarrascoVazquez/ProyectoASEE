openapi: 3.0.3
info:
  title: Servicio de Compras (Checkout)
  description: Microservicio transaccional para pagos, pasarelas bancarias y carritos de la compra unificados.
  version: 1.0.0
servers:
  - url: http://localhost:8003/api
paths:
  /compras/carrito/iniciar:
    post:
      tags: [Transacciones]
      summary: Iniciar compra mixta (Entradas y/o Merchandising)
      description: Bloquea temporalmente el aforo y el stock físico de forma concurrente. La reserva se mantiene 10 minutos.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCarritoCompletoRequest'
      responses:
        '200':
          description: Todo el stock/aforo bloqueado temporalmente. Transacción creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflicto - Stock o aforo insuficiente en alguno de los productos. Se aplican compensaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /compras/{id_transaccion}/pagar:
    post:
      tags: [Pagos]
      summary: Confirmar pago (Valida con pasarela bancaria y emite evento al Bus)
      security: [{bearerAuth: []}]
      parameters:
        - name: id_transaccion
          in: path
          required: true
          schema: 
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacionPagoRequest'
      responses:
        '200':
          description: Pago exitoso. Se emite evento asíncrono para Pedidos y/o Inventario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransaccionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflicto - La reserva ha expirado o el pago ya fue procesado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ItemEntrada:
      type: object
      required:
        - tipo_entrada
        - cantidad
      properties:
        tipo_entrada:
          type: string
          enum: [day, weekend, vip]
          example: "weekend"
        cantidad:
          type: integer
          minimum: 1
          example: 2

    ItemMerch:
      type: object
      required:
        - id_producto
        - cantidad
      properties:
        id_producto:
          type: string
          format: uuid
          example: "p1234567-e89b-12d3-a456-426614174000"
        cantidad:
          type: integer
          minimum: 1
          example: 1

    DireccionEnvio:
      type: object
      required:
        - calle
        - ciudad
        - codigo_postal
        - pais
      properties:
        calle:
          type: string
          example: "Calle Mayor 14, 2ºB"
        ciudad:
          type: string
          example: "Madrid"
        codigo_postal:
          type: string
          example: "28013"
        pais:
          type: string
          example: "España"
        telefono_contacto:
          type: string
          example: "+34600112233"

    ReservaCarritoCompletoRequest:
      type: object
      properties:
        id_festival:
          type: string
          description: Obligatorio si el array de 'entradas' contiene elementos.
          example: "fest_subsonic_2026"
        entradas:
          type: array
          description: Lista de pases para el festival.
          items:
            $ref: '#/components/schemas/ItemEntrada'
        merchandising:
          type: array
          description: Lista de productos físicos a comprar.
          items:
            $ref: '#/components/schemas/ItemMerch'
        direccion_envio:
          description: Obligatoria solo si el array de 'merchandising' no está vacío.
          $ref: '#/components/schemas/DireccionEnvio'

    ReservaResponse:
      type: object
      properties:
        id_transaccion:
          type: string
          format: uuid
          example: "tx-84729482-4829-4729"
        estado:
          type: string
          example: "PENDING"
        expiracion_reserva:
          type: string
          format: date-time
          example: "2026-10-15T18:22:00Z"
        moneda:
          type: string
          example: "EUR"
        total_pagar:
          type: number
          format: float
          example: 250.00

    ConfirmacionPagoRequest:
      type: object
      required:
        - metodo_pago
        - token_pasarela
      properties:
        metodo_pago:
          type: string
          enum: [tarjeta, paypal, bizum]
          example: "tarjeta"
        token_pasarela:
          type: string
          description: Token generado por la pasarela en el frontend.
          example: "tok_1N4L8s2eZvKYlo2C0V"

    TransaccionResponse:
      type: object
      properties:
        id_transaccion:
          type: string
          format: uuid
          example: "tx-84729482-4829-4729"
        estado:
          type: string
          example: "PAID"
        total_cobrado:
          type: number
          format: float
          example: 250.00
        recibo_url:
          type: string
          format: uri
          example: "https://pagos.subsonic.com/recibos/tx-84729482"
        fecha_pago:
          type: string
          format: date-time
          example: "2026-10-15T18:15:30Z"

    Error:
      type: object
      properties:
        codigo:
          type: integer
          example: 400
        mensaje:
          type: string
          example: "Petición incorrecta"
        detalle:
          type: string
          example: "Faltan parámetros requeridos o stock insuficiente."

  responses:
    BadRequest:
      description: Petición malformada o faltan parámetros requeridos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Acceso no autorizado (Token JWT ausente o inválido).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: La transacción solicitada no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Error interno del servidor o pasarela bancaria no disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'