openapi: 3.0.3
info:
  title: Servicio de Usuarios e Identidad
  description: Microservicio encargado de la gestión de perfiles, autenticación y control de roles.
  version: 1.0.0
servers:
  - url: http://localhost:8001/api
paths:
  /auth/register:
    post:
      tags: [Usuarios]
      summary: Registro de usuario
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUserPayload'
      responses:
        '201':
          description: Registro correcto en BD.
  /auth/login:
    get:
      tags: [Usuarios]
      summary: Login
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Login exitoso.
  /auth/perfil:
    get:
      tags: [Usuarios]
      summary: Obtener perfil activo
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Perfil devuelto.
    put:
      tags: [Usuarios]
      summary: Actualizar datos de mi perfil
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Perfil actualizado.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthUserPayload:
      type: object
      properties:
        email: { type: string, format: email }
        rol: { type: string, enum: [admin, cliente, proveedor] }
        nombre: { type: string }