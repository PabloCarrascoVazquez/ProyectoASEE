worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream servicio_usuarios {
        server userservice:8001;
    }

    upstream servicio_compras {
        server purchaseservice:8003;
    }

    upstream servicio_pedidos {
        server orderservice:8005;
    }

    upstream servicio_inventario {
        server shipinventoryservice:8004;
    }

    upstream servicio_catalogo {
        server catalogservice:8002;
    }

    server {
        # Puerto público del Gateway al que llamará el Frontend/Postman
        listen 8000;
        server_name localhost;

        # -------------------------------------------------------------
        # Configuración global de CORS para el Frontend
        # -------------------------------------------------------------
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;

        # Interceptar peticiones preflight (OPTIONS) antes de pasarlas a los microservicios
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # -------------------------------------------------------------
        # Configuración común de cabeceras Proxy
        # -------------------------------------------------------------
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";

        # Evitar que los microservicios dupliquen cabeceras CORS si alguno las tuviera
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        # -------------------------------------------------------------
        # Rutas hacia el Servicio de Usuarios (Python / Flask)
        # -------------------------------------------------------------
        location /auth/ {
            proxy_pass http://servicio_usuarios; 
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # -------------------------------------------------------------
        # Rutas hacia el Servicio de Compras (Java / Spring Boot)
        # -------------------------------------------------------------
        location /compras/ {
            proxy_pass http://servicio_compras/compras/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        # -------------------------------------------------------------
        # Rutas hacia el Servicio de Pedidos y Wallet (Go)
        # -------------------------------------------------------------
        location /pedidos/ {
            proxy_pass http://servicio_pedidos/api/pedidos/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location /acceso/ {
            proxy_pass http://servicio_pedidos/api/acceso/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # -------------------------------------------------------------
        # Rutas hacia el Servicio de Inventarios y Envíos (Java / Spring Boot)
        # -------------------------------------------------------------
        location /inventario/ {
            proxy_pass http://servicio_inventario/inventario/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location /envios/ {
            proxy_pass http://servicio_inventario/envios/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location = /envios {
            proxy_pass http://servicio_inventario/envios;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        # -------------------------------------------------------------
        # Rutas hacia el Servicio de Catálogo (Flask)
        # -------------------------------------------------------------
        location /festivales {
            proxy_pass http://servicio_catalogo/api/festivales;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location /espacios {
            proxy_pass http://servicio_catalogo/api/espacios;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location /artistas-favoritos {
            proxy_pass http://servicio_catalogo/api/artistas-favoritos;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location /artistas {
            proxy_pass http://servicio_catalogo/api/artistas;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location /catalogo/health {
            proxy_pass http://servicio_catalogo/api/health;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # -------------------------------------------------------------
        # Comprobación de salud básica del Gateway
        # -------------------------------------------------------------
        location /health {
            return 200 '{"status":"UP","gateway":"Subsonic NGINX"}';
            add_header Content-Type application/json;
        }
    }
}