worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream servicio_usuarios {
        server userservice:8001;
    }

    upstream servicio_compras {
        server purchaseservice:8003;
    }

    upstream servicio_pedidos {
        server orderservice:8005;
    }

    server {
        # Puerto público del Gateway al que llamará el Frontend/Postman
        listen 8000;
        server_name localhost;

        # -------------------------------------------------------------
        # Configuración común de cabeceras Proxy
        # -------------------------------------------------------------
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -------------------------------------------------------------
        # Rutas hacia el Servicio de Usuarios (Python / Flask)
        # Redirige todo lo que empiece por /usuarios/
        # -------------------------------------------------------------
        location /usuarios/ {
            proxy_pass http://servicio_usuarios/;
            
            # Timeouts para evitar peticiones colgadas
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # -------------------------------------------------------------
        # Rutas hacia el Servicio de Compras (Java / Spring Boot)
        # Redirige todo lo que empiece por /compras/
        # -------------------------------------------------------------
        location /compras/ {
            proxy_pass http://servicio_compras/compras/;
            
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        # -------------------------------------------------------------
        # Rutas hacia el Servicio de Pedidos y Wallet (Go)
        # Redirige /pedidos/ y /acceso/ hacia el puerto 8005
        # -------------------------------------------------------------
        location /pedidos/ {
            proxy_pass http://servicio_pedidos/api/pedidos/;
            
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location /acceso/ {
            proxy_pass http://servicio_pedidos/api/acceso/;
            
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # -------------------------------------------------------------
        # Comprobación de salud básica del Gateway
        # -------------------------------------------------------------
        location /health {
            return 200 '{"status":"UP","gateway":"Subsonic NGINX"}';
            add_header Content-Type application/json;
        }
    }
}