openapi: 3.0.3
info:
  description: "Microservicio de lectura intensiva que agrupa festivales, artistas,\
    \ escaletas, recintos y parcelas."
  title: Servicio Catálogo (Eventos y Espacios)
  version: 1.0.0
servers:
- url: http://localhost:8002/api
paths:
  /artistas-favoritos:
    post:
      operationId: artistas_favoritos_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtistaFavoritoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistaFavoritoResponse"
          description: Artista guardado en la lista de favoritos del usuario.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Petición malformada o faltan parámetros requeridos.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Acceso no autorizado (Token JWT inválido o caducado).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor.
      security:
      - bearerAuth: []
      summary: Guardar artista favorito
      tags:
      - Catálogo - Artistas
      x-openapi-router-controller: openapi_server.controllers.catálogo__artistas_controller
  /espacios/{id}/alquileres:
    post:
      operationId: espacios_id_alquileres_post
      parameters:
      - description: ID del espacio/parcela a alquilar.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlquilerRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlquilerResponse"
          description: Solicitud de alquiler registrada correctamente.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Petición malformada o faltan parámetros requeridos.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Acceso no autorizado (Token JWT inválido o caducado).
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Permisos insuficientes (ej. no tienes rol de Proveedor).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado (festival o espacio) no existe.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflicto - La parcela ya se encuentra alquilada o reservada.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor.
      security:
      - bearerAuth: []
      summary: Solicitar alquiler de parcela por un proveedor
      tags:
      - Catálogo - Espacios
      x-openapi-router-controller: openapi_server.controllers.catálogo__espacios_controller
  /festivales:
    get:
      operationId: festivales_get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Festival"
                type: array
          description: Lista de festivales devuelta con éxito.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor.
      summary: Listar festivales y su escaleta
      tags:
      - Catálogo - Eventos
      x-openapi-router-controller: openapi_server.controllers.catálogo__eventos_controller
  /festivales/{id_festival}/entradas:
    get:
      operationId: festivales_id_festival_entradas_get
      parameters:
      - explode: false
        in: path
        name: id_festival
        required: true
        schema:
          example: fest_subsonic_2026
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/TipoEntrada"
                type: array
          description: Listado de tipos de entrada y stock disponible.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado (festival o espacio) no existe.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor.
      summary: Consultar tarifas y disponibilidad de entradas
      tags:
      - Catálogo - Entradas
      x-openapi-router-controller: openapi_server.controllers.catálogo__entradas_controller
  /festivales/{id_festival}/entradas/bloquear:
    post:
      operationId: festivales_id_festival_entradas_bloquear_post
      parameters:
      - explode: false
        in: path
        name: id_festival
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloqueoCupoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloqueoCupoResponse"
          description: Cupo bloqueado con éxito.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado (festival o espacio) no existe.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Aforo agotado para este tipo de entrada.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor.
      security:
      - bearerAuth: []
      summary: Bloqueo temporal de cupo (Llamada interna desde Servicio de Compras)
      tags:
      - Catálogo - Entradas
      x-openapi-router-controller: openapi_server.controllers.catálogo__entradas_controller
  /festivales/{id_festival}/entradas/liberar:
    post:
      operationId: festivales_id_festival_entradas_liberar_post
      parameters:
      - explode: false
        in: path
        name: id_festival
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloqueoCupoRequest"
        required: true
      responses:
        "200":
          description: Cupo liberado correctamente.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor.
      security:
      - bearerAuth: []
      summary: Liberar cupo bloqueado tras expiración o fallo de pago
      tags:
      - Catálogo - Entradas
      x-openapi-router-controller: openapi_server.controllers.catálogo__entradas_controller
  /festivales/{id_festival}/espacios:
    get:
      operationId: festivales_id_festival_espacios_get
      parameters:
      - explode: false
        in: path
        name: id_festival
        required: true
        schema:
          example: fest_subsonic_2026
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Espacio"
                type: array
          description: Mapa y parcelas correspondientes al festival.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado (festival o espacio) no existe.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor.
      summary: Listar parcelas y mapa del recinto de un festival
      tags:
      - Catálogo - Espacios
      x-openapi-router-controller: openapi_server.controllers.catálogo__espacios_controller
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Petición malformada o faltan parámetros requeridos.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Acceso no autorizado (Token JWT inválido o caducado).
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Permisos insuficientes (ej. no tienes rol de Proveedor).
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: El recurso solicitado (festival o espacio) no existe.
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Error interno del servidor.
  schemas:
    Festival:
      example:
        id_festival: fest_subsonic_2026
        nombre: Subsonic Festival 2026
        fecha_inicio: 2026-07-15
        fecha_fin: 2026-07-18
        ubicacion: "Recinto Ferial, Madrid"
        artistas_destacados:
        - Daft Punk
        - Carl Cox
        - Peggy Gou
      properties:
        id_festival:
          example: fest_subsonic_2026
          title: id_festival
          type: string
        nombre:
          example: Subsonic Festival 2026
          title: nombre
          type: string
        fecha_inicio:
          example: 2026-07-15
          format: date
          title: fecha_inicio
          type: string
        fecha_fin:
          example: 2026-07-18
          format: date
          title: fecha_fin
          type: string
        ubicacion:
          example: "Recinto Ferial, Madrid"
          title: ubicacion
          type: string
        artistas_destacados:
          example:
          - Daft Punk
          - Carl Cox
          - Peggy Gou
          items:
            type: string
          title: artistas_destacados
          type: array
      title: Festival
      type: object
    Espacio:
      example:
        id_espacio: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        tipo: foodtruck
        metros_cuadrados: 15
        precio_alquiler: 1200.5
        estado: disponible
      properties:
        id_espacio:
          format: uuid
          title: id_espacio
          type: string
        tipo:
          enum:
          - foodtruck
          - mercadillo
          - vip_zone
          example: foodtruck
          title: tipo
          type: string
        metros_cuadrados:
          example: 15
          title: metros_cuadrados
          type: integer
        precio_alquiler:
          example: 1200.5
          format: float
          title: precio_alquiler
          type: number
        estado:
          enum:
          - disponible
          - reservado
          - alquilado
          example: disponible
          title: estado
          type: string
      title: Espacio
      type: object
    TipoEntrada:
      example:
        tipo: weekend
        precio: 125.0
        disponibles: 450
      properties:
        tipo:
          enum:
          - day
          - weekend
          - vip
          example: weekend
          title: tipo
          type: string
        precio:
          example: 125.0
          format: float
          title: precio
          type: number
        disponibles:
          example: 450
          title: disponibles
          type: integer
      title: TipoEntrada
      type: object
    BloqueoCupoRequest:
      example:
        tipo_entrada: weekend
        cantidad: 1
      properties:
        tipo_entrada:
          enum:
          - day
          - weekend
          - vip
          example: weekend
          title: tipo_entrada
          type: string
        cantidad:
          default: 1
          example: 1
          title: cantidad
          type: integer
      required:
      - cantidad
      - tipo_entrada
      title: BloqueoCupoRequest
      type: object
    BloqueoCupoResponse:
      example:
        bloqueado: true
        tipo_entrada: weekend
        precio_unitario: 125.0
      properties:
        bloqueado:
          example: true
          title: bloqueado
          type: boolean
        tipo_entrada:
          example: weekend
          title: tipo_entrada
          type: string
        precio_unitario:
          example: 125.0
          format: float
          title: precio_unitario
          type: number
      title: BloqueoCupoResponse
      type: object
    AlquilerRequest:
      example:
        nombre_negocio: Burger King Foodtruck
        tipo_negocio: Restauración
        necesita_conexion_electrica: true
      properties:
        nombre_negocio:
          example: Burger King Foodtruck
          title: nombre_negocio
          type: string
        tipo_negocio:
          example: Restauración
          title: tipo_negocio
          type: string
        necesita_conexion_electrica:
          example: true
          title: necesita_conexion_electrica
          type: boolean
      required:
      - nombre_negocio
      - tipo_negocio
      title: AlquilerRequest
      type: object
    AlquilerResponse:
      example:
        id_contrato: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        estado: Pendiente de firma
        fecha_solicitud: 2026-10-15T18:15:00Z
      properties:
        id_contrato:
          format: uuid
          title: id_contrato
          type: string
        estado:
          example: Pendiente de firma
          title: estado
          type: string
        fecha_solicitud:
          example: 2026-10-15T18:15:00Z
          format: date-time
          title: fecha_solicitud
          type: string
      title: AlquilerResponse
      type: object
    ArtistaFavoritoRequest:
      example:
        id_festival: fest_subsonic_2026
        nombre_artista: Peggy Gou
      properties:
        id_festival:
          example: fest_subsonic_2026
          title: id_festival
          type: string
        nombre_artista:
          example: Peggy Gou
          title: nombre_artista
          type: string
      required:
      - id_festival
      - nombre_artista
      title: ArtistaFavoritoRequest
      type: object
    ArtistaFavoritoResponse:
      example:
        mensaje: Artista añadido a favoritos correctamente.
        nombre_artista: Peggy Gou
      properties:
        mensaje:
          example: Artista añadido a favoritos correctamente.
          title: mensaje
          type: string
        nombre_artista:
          example: Peggy Gou
          title: nombre_artista
          type: string
      title: ArtistaFavoritoResponse
      type: object
    Error:
      example:
        codigo: 400
        mensaje: Error en la petición
        detalle: Parámetros no válidos.
      properties:
        codigo:
          example: 400
          title: codigo
          type: integer
        mensaje:
          example: Error en la petición
          title: mensaje
          type: string
        detalle:
          example: Parámetros no válidos.
          title: detalle
          type: string
      title: Error
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
      x-bearerInfoFunc: openapi_server.controllers.security_controller.info_from_bearerAuth
