spring.application.name=ShipInventoryService
server.port=${PORT:8004}

# --- Persistencia Dual (SQLite / MySQL) ---
db.engine=${DB_ENGINE:sqlite}
sqlite.db.path=${SQLITE_DB_PATH:shipinventory.db}
db.host=${DB_HOST:127.0.0.1}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:shipinventory_db}
db.user=${DB_USER:root}
db.password=${DB_PASSWORD:}

# --- Seguridad y JWT ---
jwt.secret=${SECRET_KEY:super-secret-subsonic-key-jwt-2026}

# --- Jackson JSON (Snake Case para coincidir con YAML OpenAPI) ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- CORS ---
cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# --- RabbitMQ (consumidor de merch_queue) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Listener RabbitMQ ---
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10
