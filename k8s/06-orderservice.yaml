apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  labels:
    app: orderservice
    app.kubernetes.io/part-of: subsonic-festival
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      containers:
        - name: orderservice
          image: subsonic-orderservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: subsonic-config
            - secretRef:
                name: subsonic-secrets
          env:
            - name: PORT
              value: "8005"
            - name: DB_NAME
              value: "orders_db"
            - name: SQLITE_DB_PATH
              value: "/app/orders.db"
            - name: DB_HOST
              value: "orders-db"
          readinessProbe:
            httpGet:
              path: /
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: orderservice
  labels:
    app: orderservice
    app.kubernetes.io/part-of: subsonic-festival
spec:
  type: ClusterIP
  selector:
    app: orderservice
  ports:
    - name: http
      port: 8005
      targetPort: 8005
