apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogservice
  labels:
    app: catalogservice
    app.kubernetes.io/part-of: subsonic-festival
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogservice
  template:
    metadata:
      labels:
        app: catalogservice
    spec:
      containers:
        - name: catalogservice
          image: subsonic-catalogservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: subsonic-config
            - secretRef:
                name: subsonic-secrets
          env:
            - name: PORT
              value: "8002"
            - name: DB_ENGINE
              valueFrom:
                configMapKeyRef:
                  name: subsonic-config
                  key: CATALOG_DB_ENGINE
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: subsonic-config
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: subsonic-config
                  key: MONGO_DB
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: subsonic-config
                  key: REDIS_URL
            - name: SQLITE_DB_PATH
              value: "/app/catalogo.db"
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: catalogservice
  labels:
    app: catalogservice
    app.kubernetes.io/part-of: subsonic-festival
spec:
  type: ClusterIP
  selector:
    app: catalogservice
  ports:
    - name: http
      port: 8002
      targetPort: 8002