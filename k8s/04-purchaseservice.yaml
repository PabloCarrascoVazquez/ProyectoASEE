apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchaseservice
  labels:
    app: purchaseservice
    app.kubernetes.io/part-of: subsonic-festival
spec:
  replicas: 1
  selector:
    matchLabels:
      app: purchaseservice
  template:
    metadata:
      labels:
        app: purchaseservice
    spec:
      containers:
        - name: purchaseservice
          image: subsonic-purchaseservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: subsonic-config
            - secretRef:
                name: subsonic-secrets
          env:
            - name: SQLITE_DB_PATH
              value: "/app/purchases.db"
            - name: PORT
              value: "8003"
            - name: DB_HOST
              value: "purchase-db"
            - name: DB_NAME
              value: "purchases_db"
          readinessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 25
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: purchaseservice
  labels:
    app: purchaseservice
    app.kubernetes.io/part-of: subsonic-festival
spec:
  type: ClusterIP
  selector:
    app: purchaseservice
  ports:
    - name: http
      port: 8003
      targetPort: 8003
