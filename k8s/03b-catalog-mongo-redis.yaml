apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-mongo
  template:
    metadata:
      labels:
        app: catalog-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-mongo
spec:
  selector:
    app: catalog-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-redis
  template:
    metadata:
      labels:
        app: catalog-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-redis
spec:
  selector:
    app: catalog-redis
  ports:
    - port: 6379
      targetPort: 6379