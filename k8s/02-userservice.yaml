apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  labels:
    app: userservice
    app.kubernetes.io/part-of: subsonic-festival
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          image: subsonic-userservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: subsonic-config
            - secretRef:
                name: subsonic-secrets
          env:
            - name: PORT
              value: "8001"
            - name: DB_NAME
              value: "users_db"
            - name: SQLITE_DB_PATH
              value: "/app/users.db"
          readinessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  labels:
    app: userservice
    app.kubernetes.io/part-of: subsonic-festival
spec:
  type: ClusterIP
  selector:
    app: userservice
  ports:
    - name: http
      port: 8001
      targetPort: 8001
