apiVersion: v1
kind: ConfigMap
metadata:
  name: subsonic-config
  labels:
    app.kubernetes.io/part-of: subsonic-festival
data:
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  QR_TOKEN_EXPIRE_MINUTES: "60"
  STAFF_ROLES: '["admin", "staff"]'
  CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:3000"]'
  DB_ENGINE: "sqlite"
  DB_HOST: "127.0.0.1"
  DB_PORT: "3306"
  DB_USER: "root"
  RABBITMQ_ENABLED: "true"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "guest"
  RABBITMQ_RECONNECT_SECONDS: "10"
  CATALOG_SERVICE_URL: "http://catalogservice:8002/api"
  INVENTORY_SERVICE_URL: "http://shipinventoryservice:8004/api"
  OUTBOX_WORKER_INTERVAL_MS: "2000"
  EXPIRATION_WORKER_INTERVAL_MS: "60000"
  CATALOG_MOCK_FALLBACK: "true"
  INVENTORY_MOCK_FALLBACK: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: subsonic-secrets
  labels:
    app.kubernetes.io/part-of: subsonic-festival
type: Opaque
stringData:
  SECRET_KEY: "super-secret-subsonic-key-jwt-2026"
  QR_SECRET_KEY: "super-secret-subsonic-qr-key-2026"
  DB_PASSWORD: "root"
  RABBITMQ_PASSWORD: "guest"
