apiVersion: v1
kind: ConfigMap
metadata:
  name: subsonic-config
  labels:
    app.kubernetes.io/part-of: subsonic-festival
data:
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  QR_TOKEN_EXPIRE_MINUTES: "60"
  STAFF_ROLES: '["admin", "staff"]'
  CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:3000", "http://localhost:48080"]'
  DB_ENGINE: "postgres"
  DB_PORT: "5432"
  DB_USER: "subsonic"
  RABBITMQ_ENABLED: "true"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "guest"
  RABBITMQ_RECONNECT_SECONDS: "10"
  CATALOG_SERVICE_URL: "http://catalogservice:8002/api"
  INVENTORY_SERVICE_URL: "http://shipinventoryservice:8004"
  OUTBOX_WORKER_INTERVAL_MS: "30000"
  EXPIRATION_WORKER_INTERVAL_MS: "60000"
  CATALOG_MOCK_FALLBACK: "false"
  INVENTORY_MOCK_FALLBACK: "false"
  CATALOG_DB_ENGINE: "mongo"
  MONGO_URI: "mongodb://catalog-mongo:27017/"
  MONGO_DB: "catalogo_db"
  REDIS_URL: "redis://catalog-redis:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: subsonic-secrets
  labels:
    app.kubernetes.io/part-of: subsonic-festival
type: Opaque
stringData:
  SECRET_KEY: "super-secret-subsonic-key-jwt-2026"
  QR_SECRET_KEY: "super-secret-subsonic-qr-key-2026"
  DB_PASSWORD: "subsonic123"
  RABBITMQ_PASSWORD: "guest"