spring.application.name=PurchaseService
server.port=${PORT:8003}

# --- Persistencia Dual (SQLite / MySQL) ---
db.engine=${DB_ENGINE:sqlite}
sqlite.db.path=${SQLITE_DB_PATH:purchases.db}
db.host=${DB_HOST:127.0.0.1}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:purchases_db}
db.user=${DB_USER:root}
db.password=${DB_PASSWORD:}

# --- Seguridad y JWT ---
jwt.secret=${SECRET_KEY:super-secret-subsonic-key-jwt-2026}

# --- CORS ---
cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# --- Microservicios Remotos (Catálogo e Inventario) ---
catalog.service.url=${CATALOG_SERVICE_URL:http://catalogservice:8002/api}
inventory.service.url=${INVENTORY_SERVICE_URL:http://inventoryservice:8004/api}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Tareas Programadas (@Scheduled) ---
outbox.worker.interval=${OUTBOX_WORKER_INTERVAL_MS:30000}
expiration.worker.interval=${EXPIRATION_WORKER_INTERVAL_MS:60000}

# Fallbacks controlados para desarrollo si Catálogo/Inventario aún no están en ejecución
CATALOG_MOCK_FALLBACK=${CATALOG_MOCK_FALLBACK:true}
INVENTORY_MOCK_FALLBACK=${INVENTORY_MOCK_FALLBACK:true}

