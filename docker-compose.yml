version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: subsonic-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  userservice:
    build: ./UserService
    container_name: subsonic-userservice
    depends_on:
      - rabbitmq

  catalogservice:
    build: ./CatalogService
    container_name: subsonic-catalogservice

  purchaseservice:
    build: ./PurchaseService
    container_name: subsonic-purchaseservice
    environment:
      - RABBITMQ_HOST=rabbitmq
      - INVENTORY_SERVICE_URL=http://shipinventoryservice:8004/api
    depends_on:
      - rabbitmq
      - shipinventoryservice

  shipinventoryservice:
    build: ./ShipInventoryService
    container_name: subsonic-shipinventoryservice
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      - rabbitmq

  gateway:
    image: nginx:alpine
    container_name: subsonic-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./Gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - userservice
      - catalogservice
      - purchaseservice
      - orderservice
      - shipinventoryservice

  orderservice:
    build: ./OrderService
    container_name: subsonic-orderservice
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      - rabbitmq
    env_file:
      - ./OrderService/.env
