version: '3.8'
services:
  # SERVICIO DEL BACKEND
  backend-subsonic:
    build: ./Back
    #image: pablocarras/subsonic-backend
    ports:
      - "5000:5000"
    environment:
      - WEBSITES_PORT=5000
    restart: always

  # SERVICIO DEL FRONTEND
  frontend-subsonic:
    build: ./Front
    #image: pablocarras/subsonic-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-subsonic
    restart: always