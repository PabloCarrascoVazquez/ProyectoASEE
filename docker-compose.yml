version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: subsonic-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  userservice:
    build: ./UserService
    container_name: subsonic-userservice
    env_file:
      - .env
    environment:
      - PORT=${USER_SERVICE_PORT:-8001}
      - DB_NAME=${USER_DB_NAME:-users_db}
      - SQLITE_DB_PATH=${USER_SQLITE_PATH:-users.db}
    depends_on:
      - rabbitmq

  catalogservice:
    build: ./CatalogService
    container_name: subsonic-catalogservice
    env_file:
      - .env
    environment:
      - PORT=${CATALOG_SERVICE_PORT:-8002}
      - DB_NAME=${CATALOG_DB_NAME:-catalogo_db}
      - SQLITE_DB_PATH=${CATALOG_SQLITE_PATH:-catalogo.db}

  purchaseservice:
    build: ./PurchaseService
    container_name: subsonic-purchaseservice
    env_file:
      - .env
    environment:
      - PORT=${PURCHASE_SERVICE_PORT:-8003}
      - DB_NAME=${PURCHASE_DB_NAME:-purchases_db}
      - SQLITE_DB_PATH=${PURCHASE_SQLITE_PATH:-purchases.db}
      - RABBITMQ_HOST=rabbitmq
      - CATALOG_SERVICE_URL=http://catalogservice:8002/api
      - INVENTORY_SERVICE_URL=http://shipinventoryservice:8004/api
    depends_on:
      - rabbitmq
      - catalogservice
      - shipinventoryservice

  shipinventoryservice:
    build: ./ShipInventoryService
    container_name: subsonic-shipinventoryservice
    env_file:
      - .env
    environment:
      - PORT=${INVENTORY_SERVICE_PORT:-8004}
      - DB_NAME=${INVENTORY_DB_NAME:-shipinventory_db}
      - SQLITE_DB_PATH=${INVENTORY_SQLITE_PATH:-shipinventory.db}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      - rabbitmq

  orderservice:
    build: ./OrderService
    container_name: subsonic-orderservice
    env_file:
      - .env
    environment:
      - PORT=${ORDER_SERVICE_PORT:-8005}
      - DB_NAME=${ORDER_DB_NAME:-orders_db}
      - SQLITE_DB_PATH=${ORDER_SQLITE_PATH:-orders.db}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      - rabbitmq

  gateway:
    image: nginx:alpine
    container_name: subsonic-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./Gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - userservice
      - catalogservice
      - purchaseservice
      - orderservice
      - shipinventoryservice
