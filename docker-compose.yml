services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: subsonic-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  # =========================================================================
  # BASES DE DATOS POSTGRESQL (Database per Service)
  # =========================================================================
  users-db:
    image: postgres:16-alpine
    container_name: subsonic-users-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-users_db}
      POSTGRES_USER: ${DB_USER:-subsonic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-subsonic123}
    volumes:
      - users_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-subsonic} -d ${USER_DB_NAME:-users_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

# =========================================================================
  # PERSISTENCIA POLÍGLOTA PARA CATALOGSERVICE (MongoDB + Redis)
  # =========================================================================
  catalog-mongo:
    image: mongo:7
    container_name: subsonic-catalog-mongo
    volumes:
      - catalog_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-redis:
    image: redis:7-alpine
    container_name: subsonic-catalog-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - catalog_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  purchase-db:
    image: postgres:16-alpine
    container_name: subsonic-purchase-db
    environment:
      POSTGRES_DB: ${PURCHASE_DB_NAME:-purchases_db}
      POSTGRES_USER: ${DB_USER:-subsonic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-subsonic123}
    volumes:
      - purchase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-subsonic} -d ${PURCHASE_DB_NAME:-purchases_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  shipinventory-db:
    image: postgres:16-alpine
    container_name: subsonic-shipinventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-shipinventory_db}
      POSTGRES_USER: ${DB_USER:-subsonic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-subsonic123}
    volumes:
      - shipinventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-subsonic} -d ${INVENTORY_DB_NAME:-shipinventory_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  orders-db:
    image: postgres:16-alpine
    container_name: subsonic-orders-db
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-orders_db}
      POSTGRES_USER: ${DB_USER:-subsonic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-subsonic123}
    volumes:
      - orders_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-subsonic} -d ${ORDER_DB_NAME:-orders_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # MICROSERVICIOS
  # =========================================================================
  userservice:
    build: ./UserService
    container_name: subsonic-userservice
    env_file:
      - .env
    environment:
      - PORT=${USER_SERVICE_PORT:-8001}
      - DB_ENGINE=postgres
      - DB_HOST=users-db
      - DB_PORT=5432
      - DB_NAME=${USER_DB_NAME:-users_db}
      - DB_USER=${DB_USER:-subsonic}
      - DB_PASSWORD=${DB_PASSWORD:-subsonic123}
    depends_on:
      rabbitmq:
        condition: service_started
      users-db:
        condition: service_healthy

  catalogservice:
    build: ./CatalogService
    container_name: subsonic-catalogservice
    env_file:
      - .env
    environment:
      - PORT=${CATALOG_SERVICE_PORT:-8002}
      - DB_ENGINE=mongo
      - MONGO_URI=mongodb://catalog-mongo:27017/
      - MONGO_DB=${CATALOG_DB_NAME:-catalogo_db}
      - REDIS_URL=redis://catalog-redis:6379/0
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      catalog-mongo:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  purchaseservice:
    build: ./PurchaseService
    container_name: subsonic-purchaseservice
    env_file:
      - .env
    environment:
      - PORT=${PURCHASE_SERVICE_PORT:-8003}
      - DB_ENGINE=postgres
      - DB_HOST=purchase-db
      - DB_PORT=5432
      - DB_NAME=${PURCHASE_DB_NAME:-purchases_db}
      - DB_USER=${DB_USER:-subsonic}
      - DB_PASSWORD=${DB_PASSWORD:-subsonic123}
      - RABBITMQ_HOST=rabbitmq
      - CATALOG_SERVICE_URL=http://catalogservice:8002/api
      - INVENTORY_SERVICE_URL=http://shipinventoryservice:8004
    depends_on:
      rabbitmq:
        condition: service_started
      purchase-db:
        condition: service_healthy
      catalogservice:
        condition: service_started
      shipinventoryservice:
        condition: service_started

  shipinventoryservice:
    build: ./ShipInventoryService
    container_name: subsonic-shipinventoryservice
    env_file:
      - .env
    environment:
      - PORT=${INVENTORY_SERVICE_PORT:-8004}
      - DB_ENGINE=postgres
      - DB_HOST=shipinventory-db
      - DB_PORT=5432
      - DB_NAME=${INVENTORY_DB_NAME:-shipinventory_db}
      - DB_USER=${DB_USER:-subsonic}
      - DB_PASSWORD=${DB_PASSWORD:-subsonic123}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      rabbitmq:
        condition: service_started
      shipinventory-db:
        condition: service_healthy

  orderservice:
    build: ./OrderService
    container_name: subsonic-orderservice
    env_file:
      - .env
    environment:
      - PORT=${ORDER_SERVICE_PORT:-8005}
      - DB_ENGINE=postgres
      - DB_HOST=orders-db
      - DB_PORT=5432
      - DB_NAME=${ORDER_DB_NAME:-orders_db}
      - DB_USER=${DB_USER:-subsonic}
      - DB_PASSWORD=${DB_PASSWORD:-subsonic123}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      rabbitmq:
        condition: service_started
      orders-db:
        condition: service_healthy

  # =========================================================================
  # GATEWAY Y FRONTEND
  # =========================================================================
  gateway:
    image: nginx:alpine
    container_name: subsonic-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./Gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - userservice
      - catalogservice
      - purchaseservice
      - orderservice
      - shipinventoryservice

  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
    container_name: subsonic-frontend
    ports:
      - "48080:80"
    depends_on:
      - gateway

  # =========================================================================
  # ADMINER (BD DOCKER)
  # =========================================================================
  adminer:
    image: adminer:latest
    container_name: subsonic-db-viewer
    ports:
      - "8080:8080"

volumes:
  users_pgdata:
  catalog_mongodata:
  catalog_redisdata:
  purchase_pgdata:
  shipinventory_pgdata:
  orders_pgdata:

