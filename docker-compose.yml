version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: subsonic-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  userservice:
    build: ./UserService
    container_name: subsonic-userservice
    depends_on:
      - rabbitmq

  catalogservice:
    build: ./CatalogService
    container_name: subsonic-catalogservice
    # Opcional: si tiene base de datos propia, lo añades en depends_on

  purchaseservice:
    build: ./PurchaseService
    container_name: subsonic-purchaseservice
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq

  gateway:
    image: nginx:alpine
    container_name: subsonic-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./Gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - userservice
      - catalogservice
      - purchaseservice
      - orderservice

  orderservice:
    build: ./OrderService
    container_name: subsonic-orderservice
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - DB_ENGINE=postgres
    depends_on:
      - rabbitmq